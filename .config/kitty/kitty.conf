cursor_shape block
shell_integration no-cursor  # Required for "cursor_shape block" to work.

tab_fade 1
tab_title_max_length 32

enabled_layouts Splits,Stack

scrollback_pager nvim --cmd 'set clipboard=unnamedplus' +'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

macos_option_as_alt yes

map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+shift+' layout_action rotate

# Run: ./select-theme.sh
# Uses: `kitty +kitten themes`
include current-theme.conf

# Run; ./select-font.sh
# Uses: `kitty list-fonts`
include current-font.conf
