cursor_shape block
shell_integration no-cursor  # Required for "cursor_shape block" to work.

tab_fade 1
tab_title_max_length 30
# tab_bar_style separator

enabled_layouts Splits,Stack
# enabled_layouts Horizontal,Stack,Vertical

map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+shift+' layout_action rotate
# map ctrl+shift+enter launch --cwd=current
# map ctrl+shift+' launch --location=split --cwd=current
# map ctrl+shift+\ layout_action rotate

map ctrl+shift+g launch --stdin-source=@last_cmd_output --type=overlay $HOME/.config/kitty/scrollback.sh -u $HOME/.config/kitty/scrollback.vim -
map ctrl+shift+h launch --stdin-source=@screen_scrollback --type=overlay $HOME/.config/kitty/scrollback.sh -u $HOME/.config/kitty/scrollback.vim -
map ctrl+shift+s launch --stdin-source=@screen_scrollback --type=overlay fzf --no-sort --tac --multi --bind 'enter:execute(sh -i -l -c "$HOME/.config/kitty/clipboard.sh {+}")+close'

macos_option_as_alt yes

# Use "kitty +kitten themes", then symlink to current-theme.conf
include current-theme.conf

# Example current-font.conf:
#   font_family      monospace
#   bold_font        auto
#   italic_font      auto
#   bold_italic_font auto
#   font_size        11
include current-font.conf
