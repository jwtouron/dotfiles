unbind C-b
set -g prefix C-'\'
bind C-'\' send-prefix

set -sa terminal-overrides ",*256col*:Tc"
set -g default-terminal "tmux-256color"
#set-option -g xterm-keys on
set -g history-limit 10000
set -g mouse on
set -g status-bg blue

setw -g mode-keys emacs

bind-key | split-window -h
bind-key - split-window -v

bind-key -T copy-mode-emacs C-c { send-keys -X copy-selection-and-cancel ; run-shell -b "tmux show-buffer 2>/dev/null | xclip -i -sel clipboard" }
bind-key -T copy-mode-vi C-c { send-keys -X copy-selection-and-cancel ; run-shell -b "tmux show-buffer 2>/dev/null | xclip -i -sel clipboard" }
bind-key -T copy-mode C-c { send-keys -X copy-selection-and-cancel ; run-shell -b "tmux show-buffer 2>/dev/null | xclip -i -sel clipboard" }
bind-key C-v run "tmux set-buffer $(xclip -o -sel clipboard); tmux paste-buffer"
