unbind C-b
set -g prefix C-g
bind C-g send-prefix

set -g base-index 1
set -g default-terminal "screen-256color"
set -g display-time 4000
set -g focus-events on
set -g history-limit 10000
set -g mouse on
set -g renumber-windows on
set -g status-interval 5
set -g status-keys emacs
set -g status-left '#[fg=#5eacd3]#S❯ '
set -g status-right '#{pane_title}'
set -g status-style 'bg=#333333 fg=#5eacd3'
set -g window-status-format "#[fg=#999999,bg=#333333]◖#[fg=#333333,bg=#999999]#I: #W [#F]#[fg=#999999,bg=#333333]◗"
set -g window-status-current-format "#[fg=#5eacd3,bg=#g]◖#[fg=#333333,bg=#5eacd3]#I: #W [#F]#[fg=#5eacd3,bg=#333333]◗"

setw -g mode-keys vi
setw -g pane-base-index 1

bind h select-pane -Z -L
bind j select-pane -Z -D
bind k select-pane -Z -U
bind l select-pane -Z -R

bind n next-window
bind p previous-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

bind b break-pane -d
bind c new-window -c '#{pane_current_path}'
bind g last-window
bind R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind u run-shell '~/.config/tmux/popup.sh'
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind Enter resize-pane -Z

bind-key -T copy-mode-vi v send-keys -X begin-selection

# Plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.config/tmux/plugins/tpm/tpm'

