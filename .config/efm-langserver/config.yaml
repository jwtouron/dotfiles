version: 2
root-markers:
  - .git/
lint-debounce: 1s

tools:
  python-black: &python-black
    format-command: 'black --quiet -'
    format-stdin: true

  python-pylint: &python-pylint
    lint-command: 'pylint --output-format text --score no --msg-template {path}:{line}:{column}:{C}:{msg} ${INPUT}'
    lint-stdin: false
    lint-formats:
      - '%f:%l:%c:%t:%m'
    lint-offset-columns: 1
    lint-category-map:
      I: H
      R: I
      C: I
      W: W
      E: E
      F: E

  sh-shellcheck: &sh-shellcheck
    lint-command: 'shellcheck -f gcc -x'
    lint-source: 'shellcheck'
    lint-formats:
      - '%f:%l:%c: %trror: %m'
      - '%f:%l:%c: %tarning: %m'
      - '%f:%l:%c: %tote: %m'

languages:
  python:
    - <<: *python-black
    - <<: *python-pylint
      lint-command: 'pylint --output-format text --score no --msg-template {path}:{line}:{column}:{C}:{msg} --from-stdin ${INPUT}'
      lint-stdin: true

  sh:
    - <<: *sh-shellcheck
