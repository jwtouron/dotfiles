# {{{1 Initial Setup

monitor = ,preferred,auto,1

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

$terminal = kitty
$fileManager = pcmanfm
$menu = wofi --show drun

# {{{2 colors

$groupbar_active_color = rgb(FAC000)
$active_border_color = rgb(FAC000) rgb(FF7500) rgb(FC6400) rgb(D73502) rgb(B62203) rgb(801100) 45deg  # fire: https://www.schemecolor.com/fire-color-scheme.php
# $active_border_color = rgb(00ffff) rgb(007f7f) 45deg  # blue-green
# $active_border_color = rgb(ff00ff) rgb(7f007f) 45deg  # purple
# $active_border_color = rgb(fcae1e) rgb(dd571c) 45deg  # orange

# {{{1 Startup Applications

exec-once = ~/.local/bin/command-notify.sh swaync && swaync
exec-once = ~/.local/bin/command-notify.sh waybar && waybar
exec-once = ~/.local/bin/command-notify.sh nm-applet && nm-applet --indicator
exec-once = ~/.local/bin/command-notify.sh udiskie && udiskie -ant
exec-once = ~/.local/bin/command-notify.sh hyprpaper && hyprpaper & ~/.config/hypr/randomize-wallpapers.sh
exec-once = command -v blueman-applet >/dev/null && blueman-applet
exec-once = ~/.config/hypr/check-pacman-updates.sh

# {{{1 Variables (Options)

# {{{2 animations
animations {
    animation = windows, 1, 2, default, slide
    animation = windowsIn, 1, 2, default, popin
    animation = windowsOut, 1, 2, default, popin
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default, slide
    animation = layers, 1, 2, default, fade
}

# {{{2 cursor
cursor {
    no_hardware_cursors = 1
}

# {{{2 decorations
decoration {
    dim_inactive = false
    dim_strength = 0.25
    rounding = 10

    shadow {
        enabled = false
    }

    # blur {
        # enabled = true
        # size = 7
        # passes = 4
        # new_optimizations = true
    # }
}

# {{{2 general
general {
    border_size = 2
    col.active_border = $active_border_color
    resize_on_border = true
}

# {{{2 group
group {
    col.border_active = $active_border_color
    col.border_inactive = rgb(444444)

    groupbar {
        render_titles = false
        rounding = 5
        indicator_height = 14
        col.active = $groupbar_active_color
        col.inactive = rgb(444444)
    }
}

# {{{2 master
master {
    new_status = inherit
    mfact = 0.625
}

# {{{1 binds

$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, Q, exec, wlogout
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod, F, fullscreenstate, 3
bind = $mainMod, space, exec, $menu
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, t, togglegroup,
bind = $mainMod, n, exec, swaync-client -t -sw
bind = $mainMod SHIFT, R, exec, hyprctl reload & swaync-client -R -rs & killall -SIGUSR2 waybar

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

bind = $mainMod SHIFT, h, movewindoworgroup, l
bind = $mainMod SHIFT, j, movewindoworgroup, d
bind = $mainMod SHIFT, k, movewindoworgroup, u
bind = $mainMod SHIFT, l, movewindoworgroup, r

bind = $mainMod ALT, h, changegroupactive, b
bind = $mainMod ALT, l, changegroupactive, f
bind = $mainMod CTRL, h, changegroupactive, b
bind = $mainMod CTRL, l, changegroupactive, f

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bind = $mainMod, Print, exec, hyprshot -m output -o ~/Pictures
bind = $mainMod SHIFT, Print, exec, hyprshot -m region -o ~/Pictures
bind = $mainMod ALT, Print, exec, hyprshot -m window -o ~/Pictures

# {{{1 Window/Layer Rules

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Pavucontrol in workspace 6
windowrule = float, class:org.pulseaudio.pavucontrol
windowrule = workspace 6, class:org.pulseaudio.pavucontrol
windowrule = size 60% 60%, class:org.pulseaudio.pavucontrol

windowrule = float, class:yad
windowrule = move cursor, class:yad, title:CLOCK_POPUP

layerrule = blur,logout_dialog
